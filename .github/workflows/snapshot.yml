name: 단지 스냅숏 갱신
on:
  schedule:
    - cron: '17 21 * * *'   # 매일 06:17 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/snapshot.mjs
        env:
          ODCLOUD_KEY: ${{ secrets.ODCLOUD_KEY }}
      - name: 변경 시 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/danji.json
          git diff --cached --quiet || (git commit -m "단지 스냅숏 갱신 $(date -u +%F)" && git push)
